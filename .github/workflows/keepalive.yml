name: Keep Automation Alive

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Update automation heartbeat
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > .github/automation-heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/automation-heartbeat.txt
          git diff --cached --quiet || git commit -m "chore: keep automation active"
          git push
