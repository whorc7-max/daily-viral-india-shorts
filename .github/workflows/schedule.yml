name: Daily Viral India Shorts With Voice And Music

on:
  schedule:
    - cron: "44 8 * * *"
    - cron: "47 16 * * *"
  workflow_dispatch:
    inputs:
      privacy_status:
        description: Visibility for this manually started upload
        required: true
        type: choice
        options:
          - public
          - unlisted
          - private
        default: public

permissions:
  contents: read

concurrency:
  group: daily-viral-india-shorts-production
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core libgomp1

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Cache Chatterbox model weights
        if: ${{ vars.TTS_BACKEND == 'chatterbox' || vars.TTS_REFERENCE_AUDIO_PATH != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: chatterbox-${{ runner.os }}-multilingual-v3

      - name: Install local voice-cloning dependencies
        if: ${{ vars.TTS_BACKEND == 'chatterbox' || vars.TTS_REFERENCE_AUDIO_PATH != '' }}
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0 torchaudio==2.6.0
          python -m pip install --disable-pip-version-check -r requirements-chatterbox.txt

      - name: Prepare private voice reference
        id: voice-reference
        env:
          TTS_REFERENCE_AUDIO_BASE64: ${{ secrets.TTS_REFERENCE_AUDIO_BASE64 }}
          TTS_REFERENCE_AUDIO_PATH: ${{ vars.TTS_REFERENCE_AUDIO_PATH }}
        run: |
          if [ -n "$TTS_REFERENCE_AUDIO_BASE64" ]; then
            umask 077
            reference_path="$RUNNER_TEMP/tts-reference.mp3"
            printf '%s' "$TTS_REFERENCE_AUDIO_BASE64" | base64 --decode > "$reference_path"
            test -s "$reference_path"
            echo "path=$reference_path" >> "$GITHUB_OUTPUT"
          else
            echo "path=$TTS_REFERENCE_AUDIO_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Load Gemini keys from Firebase vault
        env:
          FIREBASE_REFRESH_TOKEN: ${{ secrets.FIREBASE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_COLLECTION: apiKeys
          KEY_OUTPUT_PREFIX: GEMINI
        run: python scripts/fetch_gemini_keys.py

      - name: Load Pexels keys from Firebase vault
        env:
          FIREBASE_REFRESH_TOKEN: ${{ secrets.FIREBASE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FIREBASE_DATABASE_ID: ai-studio-983e8415-47eb-4f52-a589-ad65f677eec2
          FIREBASE_COLLECTION: pexels_keys
          KEY_OUTPUT_PREFIX: PEXELS
        run: python scripts/fetch_gemini_keys.py

      - name: Check credentials and service health
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: python scripts/health_check.py

      - name: Run automation pipeline
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'hi-IN-MadhurNeural' }}
          TTS_BACKEND: ${{ vars.TTS_BACKEND || 'auto' }}
          TTS_REFERENCE_AUDIO_PATH: ${{ steps.voice-reference.outputs.path }}
          CHATTERBOX_DEVICE: ${{ vars.CHATTERBOX_DEVICE || 'auto' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID || '2cdvnKJ5TZi631y5PN1s' }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL || 'eleven_multilingual_v2' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LICENSED_MUSIC_CATALOG_JSON: ${{ secrets.LICENSED_MUSIC_CATALOG_JSON }}
          YT_PRIVACY_STATUS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.privacy_status || vars.YT_PRIVACY_STATUS || 'public' }}
        run: |
          python main.py

      - name: Archive rendered video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-short-${{ github.run_number }}
          path: |
            final_short.mp4
            music_source.json
          if-no-files-found: ignore
          retention-days: 14
