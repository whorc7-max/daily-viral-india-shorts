name: Daily Viral India Shorts With Voice And Music

on:
  schedule:
    - cron: "44 8 * * *"
    - cron: "47 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-viral-india-shorts-production
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Load Gemini keys from Firebase vault
        env:
          FIREBASE_REFRESH_TOKEN: ${{ secrets.FIREBASE_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_COLLECTION: apiKeys
          KEY_OUTPUT_PREFIX: GEMINI
        run: python scripts/fetch_gemini_keys.py >> "$GITHUB_ENV"

      - name: Load Pexels keys from Firebase vault
        env:
          FIREBASE_REFRESH_TOKEN: ${{ secrets.FIREBASE_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FIREBASE_COLLECTION: pexelsKeys
          KEY_OUTPUT_PREFIX: PEXELS
        run: python scripts/fetch_gemini_keys.py >> "$GITHUB_ENV"

      - name: Check credentials and service health
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: python scripts/health_check.py

      - name: Run automation pipeline
        env:
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          TTS_VOICE: ${{ vars.TTS_VOICE || 'hi-IN-MadhurNeural' }}
          YT_PRIVACY_STATUS: ${{ vars.YT_PRIVACY_STATUS || 'public' }}
        run: |
          python main.py

